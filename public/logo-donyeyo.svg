<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dyRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a35" />
      <stop offset="100%" stop-color="#b80017" />
    </linearGradient>
    <linearGradient id="dyBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153e7e" />
      <stop offset="100%" stop-color="#091f42" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Símbolo / Escudo Don Yeyo -->
  <g filter="url(#shadow)">
    <!-- Base Red Badge -->
    <rect x="20" y="25" width="110" height="110" rx="30" fill="url(#dyRedGrad)" />
    <!-- Wheat / Panificado Icon / DY Crest -->
    <path d="M75 42 C60 55, 60 75, 75 90 C90 75, 90 55, 75 42 Z" fill="#ffffff" />
    <path d="M60 62 C50 72, 52 86, 64 96 C72 86, 70 72, 60 62 Z" fill="#ffffff" opacity="0.9" />
    <path d="M90 62 C100 72, 98 86, 86 96 C78 86, 80 72, 90 62 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="75" cy="108" r="8" fill="#ffffff" />
  </g>

  <!-- Tipografía Don Yeyo -->
  <!-- "DON" -->
  <text x="150" y="85" font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="58" fill="#0d2c5c" letter-spacing="-1">DON</text>
  <!-- "YEYO" -->
  <text x="300" y="85" font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="58" fill="#e40521" letter-spacing="-1">YEYO</text>
  
  <!-- Subtítulo Inocuidad 2026 -->
  <rect x="150" y="100" width="310" height="26" rx="13" fill="url(#dyBlueGrad)" />
  <text x="305" y="118" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="3">TRIVIA INOCUIDAD 2026</text>
</svg>
