[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  included_files = ["email_templates/**"]

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "DB_ENGINE,POINTS_PER_CORRECT,VITE_POINTS_PER_CORRECT,SCORE_TIME_FACTOR,VITE_SCORE_TIME_FACTOR,ADMIN_USER,VITE_ADMIN_USER,ADMIN_PASSWORD,VITE_ADMIN_PASSWORD,GOOGLE_SHEETS_API_KEY,VITE_GOOGLE_SHEETS_API_KEY,GOOGLE_SHEETS_SPREADSHEET_ID,VITE_GOOGLE_SHEETS_SPREADSHEET_ID,SUPABASE_URL,VITE_SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
